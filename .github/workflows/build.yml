name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Auto-Detect Project Directory & Build APK
        run: |
          # Tự động tìm thư mục chứa code nếu bạn lỡ kéo cả thư mục cleantv vào
          if [ ! -f "settings.gradle" ]; then
            TARGET_DIR=$(find . -name "settings.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET_DIR" ]; then
              echo "Tìm thấy code trong thư mục: $TARGET_DIR"
              cd "$TARGET_DIR"
            fi
          fi
          echo "Bắt đầu biên dịch APK..."
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-Android4.4-APK
          path: '**/build/outputs/apk/debug/*.apk'
