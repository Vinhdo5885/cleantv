name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Auto-Detect Project Directory & Fix Code
        run: |
          # 1. Tự tìm thư mục nếu code nằm trong thư mục con
          if [ ! -f "settings.gradle" ]; then
            TARGET_DIR=$(find . -name "settings.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET_DIR" ]; then
              echo "Di chuyển vào thư mục dự án: $TARGET_DIR"
              cd "$TARGET_DIR"
            fi
          fi

          # 2. Tự động sửa lỗi quyền truy cập ViewHolder trong code Java
          find . -name "AppGridAdapter.java" -exec sed -i 's/private static class ViewHolder/public static class ViewHolder/g' {} +
          find . -name "AppGridAdapter.java" -exec sed -i 's/ImageView imgIcon/public ImageView imgIcon/g' {} +
          find . -name "AppGridAdapter.java" -exec sed -i 's/TextView tvLabel/public TextView tvLabel/g' {} +

          # 3. Tự động chấp nhận giấy phép Android SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # 4. Biên dịch APK
          echo "Bắt đầu biên dịch APK..."
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-Android4.4-APK
          path: '**/build/outputs/apk/debug/*.apk'
